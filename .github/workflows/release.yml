name: Release

# Builds a DMG and attaches it to a GitHub release when a version tag is pushed:
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# Snipiko has no Apple Developer ID, so the result is signed but not notarized.
# Gatekeeper will refuse to open it until the user allows it by hand -- the DMG
# carries instructions, and so does the release body below.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.2.0"
        required: true

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    env:
      CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}

    steps:
      - uses: actions/checkout@v4

      # Both sources reach a shell, so neither is interpolated directly into the
      # script and both must look like a version before going any further.
      - name: Work out the version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${REF_NAME#v}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
            echo "Refusing version '$VERSION': expected digits and dots, like 0.2.0"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      # Only runs when a certificate is actually stored. The fallback below signs
      # ad-hoc instead of minting a certificate: a self-signed one has to be
      # trusted before codesign will use it, and `security add-trusted-cert`
      # blocks waiting for an authorisation prompt that never comes on a headless
      # runner. Both paths give the same result for users anyway -- a fresh
      # identity per release -- so the simpler one wins.
      - name: Import the signing certificate
        if: ${{ env.CERTIFICATE_P12 != '' }}
        env:
          CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -A
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.value }}
          SNIPIKO_IDENTITY: ${{ secrets.SIGNING_CERTIFICATE_P12 != '' && 'Snipiko Local Dev' || '-' }}
        run: |
          if [ "$SNIPIKO_IDENTITY" = "-" ]; then
            echo "::warning::No SIGNING_CERTIFICATE_P12 secret: signing ad-hoc. The app identity changes every release, so users must grant Screen Recording again after each update."
          fi
          scripts/package.sh "$VERSION"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          files: dist/*.dmg
          body: |
            ## Установка

            1. Скачайте DMG ниже и перетащите Snipiko в Applications.
            2. При первом запуске macOS скажет, что не может проверить разработчика.
               Это ожидаемо: приложение подписано, но не заверено в Apple —
               у проекта нет платного Apple Developer ID.
            3. Откройте Системные настройки → Конфиденциальность и безопасность,
               пролистайте вниз и нажмите «Открыть всё равно» рядом с Snipiko.
            4. Запустите снова, выдайте доступ к записи экрана и перезапустите Snipiko.

            Если шаг 3 не срабатывает:

                xattr -dr com.apple.quarantine /Applications/Snipiko.app

            Требуется macOS 14 или новее.
